<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 فيديو ممتع للأطفال</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe29f 0%, #ffa99f 25%, #ff719a 50%, #b993f7 75%, #8ec5fc 100%);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: #fffdf7;
    border-radius: 35px;
    padding: 30px;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    border: 6px solid #fff;
    position: relative;
    animation: pop 0.6s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .stars {
    position: absolute;
    top: -20px;
    right: -20px;
    font-size: 40px;
    animation: spin 4s linear infinite;
  }
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }
  h1 {
    text-align: center;
    font-size: 2.2em;
    color: #ff5e78;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0px #ffd166;
  }
  .subtitle {
    text-align: center;
    color: #6a4c93;
    font-size: 1.1em;
    margin-bottom: 25px;
    font-weight: bold;
  }
  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 25px;
    overflow: hidden;
    border: 5px solid #ffd166;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    cursor: pointer;
    display: block;
    text-decoration: none;
  }
  .video-wrapper img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .play-button {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    background: rgba(255, 94, 120, 0.95);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;
    border: 4px solid #fff;
  }
  .video-wrapper:hover .play-button {
    transform: translate(-50%, -50%) scale(1.1);
  }
  .play-button::after {
    content: '';
    border-style: solid;
    border-width: 18px 0 18px 28px;
    border-color: transparent transparent transparent #fff;
    margin-left: 6px;
  }
  .emojis {
    text-align: center;
    font-size: 2em;
    margin-top: 20px;
    letter-spacing: 10px;
  }
  .footer-note {
    text-align: center;
    margin-top: 15px;
    color: #999;
    font-size: 0.9em;
  }
  .bounce {
    display: inline-block;
    animation: bounce 1.5s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stars">🌟</div>
    <h1><span class="bounce">🎬</span> شاهد الفيديو الممتع <span class="bounce">🎬</span></h1>
    <p class="subtitle">استمتع بالمشاهدة يا بطل! 🌈</p>
    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/z6ZNgMqAx8I" title="فيديو للأطفال" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="emojis">🚗 ✈️ 🎈 🧸 🎨</div>
    <p class="footer-note">اضغط زر التشغيل واستمتع بالمشاهدة 😍</p>
  </div>
</body>
</html>
